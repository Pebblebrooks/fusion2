<script>
  // Theme before first paint (same 'cpf_theme' setting as the planner and the website).
  (function () {
    var mode = null;
    try { mode = localStorage.getItem('cpf_theme'); } catch (e) {}
    var dark = mode === 'dark' || ((!mode || mode === 'system') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
