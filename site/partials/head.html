<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F766E">
<script>
  // Theme: shares the planner's 'cpf_theme' setting ('dark' | 'light' | 'system').
  // Runs before the page paints, so there is no flash of the wrong theme.
  (function () {
    var mode = null;
    try { mode = localStorage.getItem('cpf_theme'); } catch (e) {}
    var dark = mode === 'dark' || ((!mode || mode === 'system') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site/site.css">
<script type="module" src="/site/site.js"></script>
